<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 800 200"><title id="title">Laravel Email Database Log</title><desc id="description">Outgoing email logging with searchable history and light and dark themes.</desc><rect width="800" height="200" fill="#fff" stroke="#e5e7eb" rx="16"/><g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="32" y="80" fill="#0f172a" font-size="40" font-weight="700" lengthAdjust="spacingAndGlyphs" letter-spacing="-.5" textLength="512">Laravel Email Database Log</text><text x="32" y="111" fill="#64748b" font-size="14">A searchable record of your application&apos;s outgoing mail.</text><rect width="108" height="22" x="32" y="132" fill="#f5f3ff" stroke="#6d28d9" stroke-width=".8" rx="11"/><text x="86" y="147" fill="#6d28d9" font-size="10" font-weight="500" text-anchor="middle">Database logging</text><rect width="106" height="22" x="150" y="132" fill="#eff6ff" stroke="#1e40af" stroke-width=".8" rx="11"/><text x="203" y="147" fill="#1e40af" font-size="10" font-weight="500" text-anchor="middle">Searchable history</text><rect width="100" height="22" x="266" y="132" fill="#f0fdf4" stroke="#166534" stroke-width=".8" rx="11"/><text x="316" y="147" fill="#166534" font-size="10" font-weight="500" text-anchor="middle">Light and dark</text></g><g stroke-linecap="round" stroke-linejoin="round" transform="translate(578 36)"><rect width="134" height="88" x="4" y="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2" rx="12"/><path fill="none" stroke="#6d28d9" stroke-width="2" d="M8 22 L71 64 L134 22 M8 94 L49 58 M134 94 L93 58"/><rect width="74" height="45" x="108" y="73" fill="#eff6ff"/><ellipse cx="145" cy="118" fill="#eff6ff" stroke="#1e40af" stroke-width="2" rx="37" ry="12"/><path fill="none" stroke="#1e40af" stroke-width="2" d="M108 74 V118 M182 74 V118"/><ellipse cx="145" cy="95" fill="#eff6ff" stroke="#1e40af" stroke-width="2" rx="37" ry="12"/><ellipse cx="145" cy="74" fill="#eff6